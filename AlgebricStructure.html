<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Algebra Test Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .test-card { border: 2px solid #e2e8f0; transition: all 0.3s; }
        .test-card:hover { border-color: #6366f1; }
        .btn-check { padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: bold; font-size: 0.8rem; }
        .status-badge { font-size: 0.7rem; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-50 p-6 md:p-12 font-sans">

    <div class="max-w-4xl mx-auto space-y-8">
        <header class="text-center border-b pb-8">
            <h1 class="text-4xl font-black text-indigo-900">The Algebra Test Lab</h1>
            <p class="text-slate-600 mt-2">Evaluate the sets below. What is their highest classification?</p>
        </header>

        <div class="grid gap-6">
            
            <div class="test-card bg-white p-6 rounded-2xl shadow-sm">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 class="text-xl font-bold">Set A: Even Integers</h2>
                        <p class="text-sm text-slate-500 font-mono">{..., -4, -2, 0, 2, 4, ...}</p>
                    </div>
                    <span class="status-badge bg-slate-100 text-slate-600">Operations: +, ×</span>
                </div>
                
                <div class="grid md:grid-cols-3 gap-3 mb-6">
                    <button onclick="checkTest(1, 'group')" class="btn-check bg-blue-100 text-blue-700 hover:bg-blue-200">Is it a Group (+)?</button>
                    <button onclick="checkTest(1, 'ring')" class="btn-check bg-purple-100 text-purple-700 hover:bg-purple-200">Is it a Ring?</button>
                    <button onclick="checkTest(1, 'field')" class="btn-check bg-emerald-100 text-emerald-700 hover:bg-emerald-200">Is it a Field?</button>
                </div>
                <div id="res-1" class="p-4 rounded-xl text-sm font-medium hidden"></div>
            </div>

            <div class="test-card bg-white p-6 rounded-2xl shadow-sm">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 class="text-xl font-bold">Set B: Modulo 6</h2>
                        <p class="text-sm text-slate-500 font-mono">{0, 1, 2, 3, 4, 5}</p>
                    </div>
                    <span class="status-badge bg-slate-100 text-slate-600">Operations: +, × (Mod 6)</span>
                </div>
                
                <div class="grid md:grid-cols-3 gap-3 mb-6">
                    <button onclick="checkTest(2, 'group')" class="btn-check bg-blue-100 text-blue-700 hover:bg-blue-200">Is it a Group (+)?</button>
                    <button onclick="checkTest(2, 'ring')" class="btn-check bg-purple-100 text-purple-700 hover:bg-purple-200">Is it a Ring?</button>
                    <button onclick="checkTest(2, 'field')" class="btn-check bg-emerald-100 text-emerald-700 hover:bg-emerald-200">Is it a Field?</button>
                </div>
                <div id="res-2" class="p-4 rounded-xl text-sm font-medium hidden"></div>
            </div>

            <div class="test-card bg-white p-6 rounded-2xl shadow-sm border-2 border-indigo-100">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 class="text-xl font-bold">Set C: Modulo 2 (Binary)</h2>
                        <p class="text-sm text-slate-500 font-mono">{0, 1}</p>
                    </div>
                    <span class="status-badge bg-indigo-100 text-indigo-600">Operations: XOR, AND</span>
                </div>
                
                <div class="grid md:grid-cols-3 gap-3 mb-6">
                    <button onclick="checkTest(3, 'group')" class="btn-check bg-blue-100 text-blue-700 hover:bg-blue-200">Is it a Group (+)?</button>
                    <button onclick="checkTest(3, 'ring')" class="btn-check bg-purple-100 text-purple-700 hover:bg-purple-200">Is it a Ring?</button>
                    <button onclick="checkTest(3, 'field')" class="btn-check bg-emerald-100 text-emerald-700 hover:bg-emerald-200">Is it a Field?</button>
                </div>
                <div id="res-3" class="p-4 rounded-xl text-sm font-medium hidden"></div>
            </div>

        </div>
    </div>

    <script>
        const feedback = {
            1: {
                group: "✅ YES. Even + Even = Even. 0 is even. -2 is even. It's a Group.",
                ring: "❌ NO. A Ring requires a Multiplicative Identity (the number 1). Since 1 is odd, it's not in the set!",
                field: "❌ NO. If it's not a Ring, it can't be a Field."
            },
            2: {
                group: "✅ YES. Addition mod 6 follows all rules.",
                ring: "✅ YES. Multiplication mod 6 is associative and distributive.",
                field: "❌ NO! In Mod 6, 2 * 3 = 0. This means 'Zero Divisors' exist, and 2 has no inverse. (2*1=2, 2*2=4, 2*3=0... no 1!)."
            },
            3: {
                group: "✅ YES. 1+1=0, 0 is identity. 1 is its own inverse.",
                ring: "✅ YES. Passes all requirements.",
                field: "✅ YES! This is GF(2), the smallest possible Field. Essential for computers!"
            }
        };

        function checkTest(id, type) {
            const el = document.getElementById(`res-${id}`);
            el.classList.remove('hidden', 'bg-blue-50', 'bg-red-50', 'text-blue-800', 'text-red-800');
            
            const msg = feedback[id][type];
            const isSuccess = msg.includes('✅');
            
            el.innerText = msg;
            el.classList.add(isSuccess ? 'bg-blue-50' : 'bg-red-50');
            el.classList.add(isSuccess ? 'text-blue-800' : 'text-red-800');
        }
    </script>
</body>
</html>
